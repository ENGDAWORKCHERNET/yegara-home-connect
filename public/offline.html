<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — Yegara</title>
    <meta name="theme-color" content="#2e7d4f" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f7f9f7;
        color: #1a201c;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e1e7e2;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 26rem;
        width: 100%;
        box-shadow: 0 4px 20px -2px rgba(46, 125, 79, 0.08);
      }
      .icon-wrap {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        background-color: rgba(46, 125, 79, 0.12);
        color: #2e7d4f;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-wrap svg {
        width: 2rem;
        height: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: #1a201c;
      }
      p {
        font-size: 0.95rem;
        color: #5c6960;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #2e7d4f;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s ease;
        width: 100%;
      }
      .btn:hover {
        background-color: #256640;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You're currently offline</h1>
      <p>Please check your internet connection to continue managing your properties and payments on Yegara.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
